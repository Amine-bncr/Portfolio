<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta name="author" content="Mohamed Amine Bennacer" />
    <meta name="theme-color" content="#0c1018" />
    <meta name="color-scheme" content="dark" />
    <!-- canonical -->
    <!-- og:url -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Amine-dev" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:alt" content="Amine Bennacer, computer science student and web developer in London." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TITLE%" />
    <meta name="twitter:description" content="%DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="me" href="https://github.com/Amine-bncr" />
    <link rel="me" href="https://www.linkedin.com/in/amine-bennacer-6a85b2298" />
    <script type="application/ld+json">%JSONLD%</script>
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="audience">
        <option value="I need a website">I need a website</option>
        <option value="I'm hiring">I'm hiring</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
